<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Registration - Christian Wijaya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/model-registration.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="hamburger-menu" id="closeMenu"></div>
                <h2 class="sidebar-title" id="sidebarMenuTitle">✕ Menu</h2>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="model-registration.html" class="active">Model Registration</a></li>
                    <li><a href="about.html">About Us</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <div class="hamburger-menu" id="openMenu">☰</div>
                <h1>Christian Wijaya</h1>
            </header>

            <div class="content">
                <div class="registration-container">
                    <div class="models-image">
                        <img src="assets/hero.png" alt="Christian Wijaya Models">
                    </div>
                    <div class="registration-form-container">
                        <h2>Model Registration</h2>
                        <form id="modelRegistrationForm">
                            <div class="form-group">
                                <label for="name">Name:</label>
                                <input type="text" id="name" name="name" placeholder="Enter your full name">
                                <span class="error-message" id="nameError"></span>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email address">
                                <span class="error-message" id="emailError"></span>
                            </div>
                            
                            <div class="form-group">
                                <label for="birthdate">Birth Date:</label>
                                <input type="date" id="birthdate" name="birthdate">
                                <span class="error-message" id="birthdateError"></span>
                            </div>
                            
                            <div class="form-group">
                                <label>Gender:</label>
                                <div class="radio-group">
                                    <label class="radio-label">
                                        <input type="radio" name="gender" value="male"> Male
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="gender" value="female"> Female
                                    </label>
                                </div>
                                <span class="error-message" id="genderError"></span>
                            </div>                           
                            
                            <div class="form-group checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="terms" name="terms">
                                    I accept the terms and conditions
                                </label>
                                <span class="error-message" id="termsError"></span>
                            </div>
                            
                            <button type="submit" class="submit-btn">Submit</button>
                        </form>
                    </div>
                </div>
            </div>

            <footer>
                <p>Christian Wijaya &copy; 2025</p>
            </footer>
        </main>
    </div>

    <script src="js/script.js"></script>
    <script src="js/model-registration.js"></script>
</body>
</html>
